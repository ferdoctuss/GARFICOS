<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Maquinaria - BI</title>
    <!-- Cargamos Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        /* Panel de Filtros */
        .filter-panel {
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #555;
        }
        .filter-group input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 0.9rem;
        }
        .filter-btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .filter-btn:hover {
            background-color: #1f618d;
        }
        .reset-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .reset-btn:hover {
            background-color: #616a6b;
        }
        /* Contenedores de Gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        .chart-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.08);
        }
        .chart-card h3 {
            margin-top: 0;
            color: #34495e;
            font-size: 1.1rem;
            text-align: center;
        }
        .loading {
            font-size: 1.2rem;
            color: #2980b9;
            font-weight: bold;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Control - Consorcio Vial BAAS</h1>
        <p class="subtitle">Monitoreo inteligente de horas de maquinaria</p>
    </header>

    <!-- Filtros de Fecha -->
    <div class="filter-panel">
        <div class="filter-group">
            <label for="startDate">Fecha Inicio:</label>
            <input type="date" id="startDate">
        </div>
        <div class="filter-group">
            <label for="endDate">Fecha Fin:</label>
            <input type="date" id="endDate">
        </div>
        <button class="filter-btn" onclick="aplicarFiltros()">Filtrar Reporte</button>
        <button class="reset-btn" onclick="limpiarFiltros()">Ver Todo</button>
    </div>

    <div id="loadingMessage" class="loading">Cargando registros de maquinaria...</div>

    <!-- Grilla de Gráficos -->
    <div class="charts-grid" id="dashboardContent" style="display: none;">
        <div class="chart-card">
            <h3>Evolución de Horas Totales por Fecha</h3>
            <canvas id="lineChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Horas Trabajadas por Equipo</h3>
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <script>
        const urlAPI = 'https://script.google.com/macros/s/AKfycbzqYSYO6YLgy6BHwx4EjoSv0AQcvBZmyLmT_pEsxFIRn7GWGlmIO_DbQw8Fe0thjlnD/exec';
        
        let rawData = [];
        let lineChartInstance = null;
        let barChartInstance = null;

        async function initDashboard() {
            try {
                const response = await fetch(urlAPI, { method: 'GET', mode: 'cors' });
                if (!response.ok) throw new Error('Error al conectar con la API');
                
                rawData = await response.json();
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'grid';

                if (!rawData || rawData.length === 0) {
                    document.getElementById('loadingMessage').innerText = "La hoja de cálculo no contiene datos.";
                    document.getElementById('loadingMessage').style.display = 'block';
                    return;
                }

                renderCharts(rawData);

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loadingMessage').innerText = "Error al conectar con Google Sheets.";
                document.getElementById('loadingMessage').style.color = "#e74c3c";
            }
        }

        // Función auxiliar para convertir cualquier formato de fecha a YYYY-MM-DD para poder comparar
        function normalizarFecha(fechaStr) {
            if (!fechaStr) return null;
            let str = String(fechaStr).trim();

            // Si viene en formato ISO de Google (ej: 2026-10-01T00:00:00.000Z)
            if (str.includes('T')) {
                return str.substring(0, 10);
            }

            // Si viene en formato D/M/YYYY o D/M/YY (ej: 1/10/26 o 01/10/2026)
            if (str.includes('/')) {
                let partes = str.split('/');
                if (partes.length === 3) {
                    let dia = partes[0].padStart(2, '0');
                    let mes = partes[1].padStart(2, '0');
                    let anio = partes[2];
                    if (anio.length === 2) {
                        anio = '20' + anio; // Asume años 2000+
                    }
                    return `${anio}-${mes}-${dia}`;
                }
            }

            // Si ya está como YYYY-MM-DD
            if (str.match(/^\d{4}-\d{2}-\d{2}$/)) {
                return str;
            }

            return null;
        }

        function renderCharts(dataToRender) {
            const horasPorFecha = {};
            const horasPorEquipo = {};

            dataToRender.forEach(row => {
                let fechaNormalizada = normalizarFecha(row.FECHA);
                let fechaLabel = fechaNormalizada || 'Sin Fecha';
                let totalHoras = Number(row.TOTAL) || 0;
                let equipo = row.EQUIPO ? String(row.EQUIPO) : 'Sin Equipo';

                // Sumar por Fecha
                if (horasPorFecha[fechaLabel]) {
                    horasPorFecha[fechaLabel] += totalHoras;
                } else {
                    horasPorFecha[fechaLabel] = totalHoras;
                }

                // Sumar por Equipo
                if (horasPorEquipo[equipo]) {
                    horasPorEquipo[equipo] += totalHoras;
                } else {
                    horasPorEquipo[equipo] = totalHoras;
                }
            });

            const labelsFecha = Object.keys(horasPorFecha);
            const valuesFecha = Object.values(horasPorFecha);

            const labelsEquipo = Object.keys(horasPorEquipo);
            const valuesEquipo = Object.values(horasPorEquipo);

            if (lineChartInstance) lineChartInstance.destroy();
            if (barChartInstance) barChartInstance.destroy();

            // 1. Gráfico de Líneas
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labelsFecha,
                    datasets: [{
                        label: 'Total de Horas',
                        data: valuesFecha,
                        borderColor: '#2980b9',
                        backgroundColor: 'rgba(41, 128, 185, 0.1)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });

            // 2. Gráfico de Barras
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: labelsEquipo,
                    datasets: [{
                        label: 'Horas Acumuladas',
                        data: valuesEquipo,
                        backgroundColor: '#27ae60',
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { beginAtZero: true },
                        x: { ticks: { font: { size: 10 } } }
                    } 
                }
            });
        }

        function aplicarFiltros() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!startDate && !endDate) {
                renderCharts(rawData);
                return;
            }

            const filteredData = rawData.filter(row => {
                let fechaRow = normalizarFecha(row.FECHA);
                if (!fechaRow) return false;

                if (startDate && fechaRow < startDate) return false;
                if (endDate && fechaRow > endDate) return false;
                return true;
            });

            renderCharts(filteredData);
        }

        function limpiarFiltros() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderCharts(rawData);
        }

        initDashboard();
    </script>

</body>
</html>
