<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Asistencias - BI</title>
    <!-- Cargamos la librería Chart.js desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            margin-bottom: 25px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        .chart-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .loading {
            font-size: 1.1rem;
            color: #2980b9;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel de Control de Asistencias</h1>
        <p class="subtitle">Datos sincronizados en tiempo real desde Google Sheets</p>
    </header>

    <div class="chart-container">
        <div id="loadingMessage" class="loading">Cargando datos desde Google Sheets...</div>
        <canvas id="asistenciasChart"></canvas>
    </div>

    <script>
        // Tu URL exacta generada por Google Apps Script
        const urlAPI = 'https://script.google.com/macros/s/AKfycbzqYSYO6YLgy6BHwx4EjoSv0AQcvBZmyLmT_pEsxFIRn7GWGlmIO_DbQw8Fe0thjlnD/exec';

        async function cargarDatosYCrearGrafico() {
            try {
                // Usamos mode: 'cors' explícitamente
                const response = await fetch(urlAPI, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Ocultamos el mensaje de carga
                document.getElementById('loadingMessage').style.display = 'none';

                if (!data || data.length === 0) {
                    document.getElementById('loadingMessage').innerText = "La hoja de cálculo está vacía o no tiene registros.";
                    document.getElementById('loadingMessage').style.display = 'block';
                    return;
                }

                // Ajusta 'Fecha' y 'Cantidad' según los títulos de las columnas de tu Google Sheet
                const labels = data.map(row => row.Fecha || 'Sin Fecha');
                const valores = data.map(row => Number(row.Cantidad) || 0);

                const ctx = document.getElementById('asistenciasChart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Asistencia Registrada',
                            data: valores,
                            backgroundColor: 'rgba(52, 152, 219, 0.7)',
                            borderColor: 'rgba(41, 128, 185, 1)',
                            borderWidth: 1.5,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    precision: 0
                                }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error("Error detallado:", error);
                document.getElementById('loadingMessageinnerHTML').innerText = "Error al conectar con Google Sheets. Revisa que el script tenga permisos públicos.";
                document.getElementById('loadingMessage').style.color = "#e74c3c";
            }
        }

        cargarDatosYCrearGrafico();
    </script>

</body>
</html>
